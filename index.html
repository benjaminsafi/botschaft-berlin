  c1.textContent=t.c1; c2.textContent=t.c2; sub.textContent="© 2026 · "+t.credit;
  langs.innerHTML=["ps","fa","de","en"].map(c=>`<button class="${c===lang?"on":""}" onclick="setLang('${c}')">${{ps:"پښتو",fa:"دری",de:"Deutsch",en:"English"}[c]}</button>`).join("");
  nav.innerHTML=t.nav.map(([id,l])=>`<button class="${page===id?"on":""}" onclick="go('${id}')">${l}</button>`).join("");
  l1.innerHTML=t.l1.map(([id,l])=>`<button onclick="go('${id}')">${l}</button>`).join("");
  l2.innerHTML=t.l2.map(([id,l])=>`<button onclick="go('${id}')">${l}</button>`).join("");
  let b="";
  if(page==="home"){
    b=`<section class="hero"><div class="hero-copy"><span class="kicker">Berlin · Grunewald</span><h1>${t.h1}</h1><p>${t.lead}</p><div><button class="btn" onclick="go('services')">${t.cta}</button><button class="btn ghost" onclick="go('book')">${t.cta2}</button></div></div><img src="${PHOTO}" alt="Taunusstraße 3"></section>
    <section class="stats">${t.st.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("")}</section>
    <section class="wrap"><h2>${t.svcT}</h2><p class="lede">${t.svcL}</p><div class="grid g3">${t.cards.map((c,i)=>`<button class="card svc" onclick="go('svc-'+${i})"><span class="num">${c[0]}</span><span><h3>${c[1]}</h3><p>${c[2]}</p></span></button>`).join("")}</div></section>
    <section class="band"><div class="wrap split"><img src="${SIDE}" alt=""><div><h2>${t.quote}</h2><p>${t.qp}</p><button class="btn ink" onclick="go('contact')">${t.nav[5][1]}</button></div></div></section>`;
  } else if(page==="services"){
    b=`<section class="wrap"><h2>${t.svcT}</h2><div class="grid g2"><div>${t.cards.map((c,i)=>`<button class="card" onclick="go('svc-'+${i})" style="text-align:inherit;width:100%"><h3>${c[1]}</h3><p>${c[2]}</p><b>${t.more}</b></button>`).join("")}</div><aside class="card"><h3>${t.hours}</h3><table>${t.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table><p>Kronberger Straße 5<br>+49 30 20673516</p><button class="btn ink" onclick="go('book')">${t.cta2}</button></aside></div></section>`;
  } else if(page.startsWith("svc-")){
    const i=+page.split("-")[1], d=(DETAILS.fa[i]);
    const blocks=d.sections.map(s=>`<article class="card"><h3>${s.h}</h3>${(s.ps||[]).map(x=>`<p>${x}</p>`).join("")}${s.lis?`<ul>${s.lis.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}</article>`).join("");
    b=`<section class="page-hero"><div class="wrap"><button class="btn" onclick="go('services')">${t.back}</button><h2>${t.cards[i][1]}</h2><p>${d.lead}</p></div></section><section class="wrap"><div class="grid g2">${blocks}</div><p class="note">${d.note}</p><button class="btn ink" onclick="go('book')">${t.cta2}</button></section>`;
  } else if(page==="visa"){
    b=`<section class="wrap"><h2>${t.visaT}</h2><p class="lede">${t.visaL}</p><div class="grid g2">${t.vtypes.map(v=>`<article class="card"><h3>${v[0]}</h3><p>${v[1]}</p></article>`).join("")}</div><h2 style="margin-top:28px">${t.bookT}</h2><ol class="steps">${t.steps.map(s=>`<li>${s}</li>`).join("")}</ol></section>`;
  } else if(page==="book"){
    b=`<section class="wrap"><h2>${t.bookT}</h2><p class="lede">${t.bookL}</p><form class="card" onsubmit="event.preventDefault();this.querySelector('.ok').hidden=false"><label>${t.name}<input required></label><label>${t.mail}<input type="email" required></label><label>${t.topic}<select><option>Passport</option><option>Visa</option><option>Legalization</option><option>Civil status</option></select></label><label>${t.msg}<textarea></textarea></label><button class="btn ink">${t.cta2}</button><div class="ok" hidden>${t.sent}</div></form></section>`;
  } else if(page==="faq"){
    b=`<section class="wrap"><h2>${t.faqT}</h2><div class="faq">${t.faqs.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}</div></section>`;
  } else {
    b=`<section class="wrap"><h2>${t.conT}</h2><p class="lede">${t.conL}</p><div class="grid g2"><div class="card"><p><b>Taunusstraße 3, 14193 Berlin</b><br>+49 30 20673510<br>info@afghanembassy.de</p><p>Kronberger Straße 5<br>+49 30 20673516</p></div><iframe class="map" title="map" src="https://www.openstreetmap.org/export/embed.html?bbox=13.274%2C52.478%2C13.283%2C52.482&layer=mapnik&marker=52.47983%2C13.27839"></iframe></div></section>`;
  }
  app.innerHTML=b;
}
render();
</script>
</body>
</html>
