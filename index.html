<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>په برلین کې د افغانستان د اسلامي جمهوریت سفارت</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,560;8..60,650&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1630;--muted:#5c5670;--line:#e4dcf0;--paper:#f7f4fb;--purple:#4b2178;--gold:#c6a15b;--blue:#1d4e89;--max:1180px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:#fff;font-family:"Source Sans 3","Noto Naskh Arabic",sans-serif;font-size:17px;line-height:1.7}
body[dir=rtl]{font-family:"Noto Naskh Arabic","Source Sans 3",sans-serif}
button,input,select,textarea{font-family:inherit}img{max-width:100%;display:block}
[hidden]{display:none!important}
.top{background:var(--purple);color:#fff;font-size:13px;text-align:center;padding:8px 16px;border-bottom:3px solid var(--gold)}
.bar{display:flex;height:7px}.bar i{flex:1;background:linear-gradient(90deg,var(--purple),var(--blue) 55%,var(--gold))}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;width:min(var(--max),calc(100% - 32px));margin:0 auto;padding:16px 0;flex-wrap:nowrap}
.brand{display:flex;gap:12px;align-items:center;cursor:pointer;min-width:0}
.flag-scene{display:flex;align-items:stretch;flex:none;height:120px}
.pole{width:4px;background:linear-gradient(#d7c08a,#8a6a32);border-radius:2px}
.flag-wrap{width:180px;height:120px;perspective:500px;overflow:visible}
.flag-cloth{width:180px;height:120px;transform-origin:0% 50%;animation:wave 2.8s ease-in-out infinite;filter:drop-shadow(8px 4px 0 rgba(0,0,0,.25))}
body[dir=rtl] .flag-cloth{transform-origin:100% 50%}
.flag-cloth svg,.flag-cloth img{width:180px;height:120px;border:0;display:block;object-fit:contain;background:#fff}
@keyframes wave{
  0%,100%{transform:perspective(400px) rotateY(0deg)}
  50%{transform:perspective(400px) rotateY(8deg)}
}

  20%{transform:perspective(180px) rotateY(26deg) skewY(3deg) scaleX(.94)}
  45%{transform:perspective(180px) rotateY(8deg) skewY(-2deg)}
  70%{transform:perspective(180px) rotateY(32deg) skewY(4deg) scaleX(.92)}
  100%{transform:perspective(180px) rotateY(0deg) skewY(0deg)}
}
.langbar{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:center;gap:14px;background:#fff;border-bottom:1px solid #eadff5;padding:8px 12px;overflow:auto}
.langbar button{display:inline-flex;border:1px solid transparent;background:#f7f4fb;color:var(--purple);cursor:pointer;padding:6px 12px;white-space:nowrap;font-size:14px;border-radius:99px}
.langbar button.on{background:var(--gold);color:var(--purple);border-color:var(--gold);font-weight:700}
.brand strong{font-family:"Source Serif 4","Noto Naskh Arabic",serif;font-size:20px;color:var(--purple);line-height:1.35}
nav{position:sticky;top:0;z-index:9;background:var(--blue)}
nav .in{width:min(var(--max),calc(100% - 32px));margin:0 auto;display:flex;gap:4px;overflow:auto}
nav button{background:none;border:0;color:#fff;padding:13px 14px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--gold);color:var(--purple)}
.page-hero{background:linear-gradient(145deg,var(--purple),var(--blue));color:#fff;padding:8px 0 28px;border-bottom:4px solid var(--gold)}
.page-hero h2{color:#fff}
.page-hero h2:after{background:var(--gold)}
.page-hero p{color:#f4efe4;max-width:46rem}
.hero{display:grid;grid-template-columns:1.05fr .95fr;min-height:520px;background:linear-gradient(145deg,var(--purple),var(--blue));color:#fff}
.hero-copy{padding:64px 7vw 48px;display:flex;flex-direction:column;justify-content:flex-end}
.kicker{display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:3px 8px;font-size:12px;letter-spacing:.12em;margin-bottom:12px}
.hero h1{font-family:"Source Serif 4","Noto Naskh Arabic",serif;font-size:clamp(36px,5vw,62px);line-height:1.12;margin:0 0 12px;font-weight:600}
.hero p{max-width:38rem;color:#f4efe4}
.hero img{width:100%;height:100%;object-fit:cover;min-height:320px}
.btn{border:0;background:var(--gold);color:var(--purple);padding:11px 16px;font-weight:700;cursor:pointer;margin-inline-end:8px}
.btn.ink{background:var(--purple);color:#fff}.btn.ghost{background:transparent;color:#fff;border:1px solid var(--gold)}
.wrap{width:min(var(--max),calc(100% - 32px));margin:0 auto;padding:52px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--purple);color:#fff}
.stats div{padding:22px;border-inline-start:1px solid rgba(198,161,91,.45)}
.stats b{display:block;font-size:26px;font-family:"Source Serif 4","Noto Naskh Arabic",serif;color:var(--gold)}
.stats span{color:#efe8f8;font-size:14px}
h2{font-family:"Source Serif 4","Noto Naskh Arabic",serif;font-size:34px;margin:0 0 8px;font-weight:600;color:var(--purple)}
h2:after{content:"";display:block;width:72px;height:3px;background:linear-gradient(90deg,var(--gold),var(--blue));margin-top:8px}
.lede{color:var(--muted);max-width:44rem}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.15fr .85fr}
.card{border:1px solid var(--line);border-top:4px solid var(--gold);padding:18px;background:#fff}
.card h3{margin:8px 0;font-family:"Source Serif 4","Noto Naskh Arabic",serif;font-size:22px;color:var(--blue)}
.card p{color:var(--muted);margin:0 0 10px}
.card button{background:none;border:0;padding:0;font-weight:700;cursor:pointer;color:var(--purple)}
.svc{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start;text-align:inherit;width:100%;cursor:pointer}
.num{font-size:28px;font-family:"Source Serif 4",serif;color:var(--gold)}
.band{background:linear-gradient(180deg,#f4f0fa,#eef3f9)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.split img{height:360px;width:100%;object-fit:cover;border-bottom:5px solid var(--gold)}
ol.steps{padding-inline-start:18px}.steps li{margin:8px 0}
.faq details{border-bottom:1px solid var(--line);padding:10px 0}
.faq summary{cursor:pointer;font-weight:700;color:var(--purple)}
table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--blue);color:#fff}
.note{background:#f7f1e4;border-inline-start:4px solid var(--gold);padding:12px}
form{display:grid;gap:10px}label{font-size:14px;font-weight:700;display:grid;gap:5px;color:var(--purple)}
input,select,textarea{border:1px solid #d9d0e8;padding:10px;font-size:16px}textarea{min-height:100px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold)}
.ok{background:#eef3fa;padding:10px;color:var(--blue)}
.map{border:0;width:100%;height:280px;border-top:4px solid var(--blue)}
footer{background:var(--purple);color:#f6f1ea;padding:36px 0 16px;border-top:4px solid var(--gold)}
footer a,footer button{color:#fff;background:none;border:0;cursor:pointer;display:block;padding:3px 0}
.foot{width:min(var(--max),calc(100% - 32px));margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:20px}
.sub{border-top:1px solid rgba(198,161,91,.4);margin-top:20px;padding-top:12px;color:#eadfbe;font-size:13px}
@media(max-width:860px){.hero,.stats,.g3,.g2,.split,.foot{grid-template-columns:1fr}.stats div{border:0;border-top:1px solid #333}}
</style>
</head>
